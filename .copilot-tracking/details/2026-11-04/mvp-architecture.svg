<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="920" viewBox="0 0 1680 920" role="img" aria-labelledby="title desc">
  <title id="title">경영관리 종합분석 Agent MVP 아키텍처</title>
  <desc id="desc">관리자와 부서장이 경영 질문을 입력하면 근거 검증, 통합 분석, 인간 검토를 거쳐 의사결정 지원을 제공하는 경영관리 종합분석 Agent 아키텍처.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#F5F7FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="insight" x1="0" x2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
  </defs>

  <rect width="1680" height="920" fill="url(#bg)"/>

  <text x="70" y="58" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="28" font-weight="800" fill="#0F172A">경영관리 종합분석 Agent — MVP 아키텍처</text>
  <text x="70" y="88" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="16" fill="#475569">재무 · 영업 · 운영 · 리스크를 통합해 경영 질문에 대한 근거 기반 인사이트를 제공</text>

  <rect x="60" y="120" width="1560" height="700" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>

  <rect x="90" y="155" width="200" height="110" rx="18" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/>
  <text x="190" y="195" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#4338CA">경영진 / 부서장</text>
  <text x="190" y="219" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="16" font-weight="800" fill="#1E293B">업무 질문</text>
  <text x="190" y="245" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">예산·성과·리스크·추세</text>

  <rect x="340" y="155" width="220" height="110" rx="18" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="2"/>
  <text x="450" y="195" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#0F766E">질문 수집</text>
  <text x="450" y="223" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="16" font-weight="800" fill="#1E293B">경영 문맥 해석</text>
  <text x="450" y="245" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">기간 / KPI / 부서 / 의사결정 목표</text>

  <rect x="610" y="155" width="220" height="110" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="720" y="195" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8">근거 검증</text>
  <text x="720" y="223" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="16" font-weight="800" fill="#1E293B">승인된 소스만 허용</text>
  <text x="720" y="245" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">사실 / 가정 / 불확실성 분리</text>

  <rect x="880" y="155" width="260" height="110" rx="18" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="1010" y="195" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#6D28D9">소스 매핑</text>
  <text x="1010" y="223" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="16" font-weight="800" fill="#1E293B">재무 · 영업 · 운영 통합</text>
  <text x="1010" y="245" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">성과 / 리스크 / 예산 편차</text>

  <rect x="1190" y="155" width="240" height="110" rx="18" fill="#ECFEFF" stroke="#99F6E4" stroke-width="2"/>
  <text x="1310" y="195" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#0F766E">요약 생성</text>
  <text x="1310" y="223" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="16" font-weight="800" fill="#1E293B">경영 브리프</text>
  <text x="1310" y="245" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">핵심 원인 · 영향 · 다음 행동</text>

  <path d="M290 210 H340" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M560 210 H610" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M830 210 H880" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1140 210 H1190" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="190" y="345" width="220" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="300" y="380" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="15" font-weight="800" fill="#1E293B">데이터 소스</text>
  <text x="300" y="410" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- KPI / 재무 실적</text>
  <text x="300" y="432" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- 영업·고객 활동</text>
  <text x="300" y="454" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- 운영/프로젝트 현황</text>
  <text x="300" y="476" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- SharePoint / 이메일 / 보고서</text>

  <rect x="470" y="345" width="240" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="590" y="380" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="15" font-weight="800" fill="#1E293B">검증 게이트</text>
  <text x="590" y="410" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- 승인된 문서만 수집</text>
  <text x="590" y="432" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- 근거 품질 / 출처 보장</text>
  <text x="590" y="454" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- 허용된 범위를 벗어나면 중단</text>
  <text x="590" y="476" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- 사실/가정/불확실성 태깅</text>

  <rect x="770" y="345" width="290" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="915" y="380" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="15" font-weight="800" fill="#1E293B">AI 검색 · 인사이트 엔진</text>
  <text x="915" y="410" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- 관련 문서 및 지표 연결</text>
  <text x="915" y="432" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- 추세·이상치·편차 탐지</text>
  <text x="915" y="454" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- 경영 담당자 질문에 대한 맥락화</text>
  <text x="915" y="476" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- 근거 링크 포함</text>

  <rect x="1110" y="345" width="300" height="150" rx="18" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
  <text x="1260" y="380" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="15" font-weight="800" fill="#065F46">합성된 경영 요약</text>
  <text x="1260" y="410" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#065F46">- 핵심 현황</text>
  <text x="1260" y="432" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#065F46">- 원인 및 영향</text>
  <text x="1260" y="454" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#065F46">- 리스크 / 기회 / 우선순위</text>
  <text x="1260" y="476" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#065F46">- 다음 액션 제안</text>

  <path d="M410 420 L470 420" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M710 420 L770 420" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1060 420 L1110 420" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="350" y="560" width="220" height="140" rx="18" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
  <text x="460" y="595" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="15" font-weight="800" fill="#92400E">인간 검토</text>
  <text x="460" y="625" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#78350F">- 승인자 확인</text>
  <text x="460" y="647" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#78350F">- 의사결정 책임 유지</text>
  <text x="460" y="669" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#78350F">- 신뢰도 낮음 시 재검토</text>

  <rect x="670" y="560" width="300" height="140" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="820" y="595" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="15" font-weight="800" fill="#0F172A">의사결정/실행</text>
  <text x="820" y="625" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- 예산 조정</text>
  <text x="820" y="647" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- 리스크 대응</text>
  <text x="820" y="669" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">- 운영 계획 재조정</text>

  <rect x="1060" y="560" width="310" height="140" rx="18" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="1215" y="595" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Azure 기반 운영층</text>
  <text x="1215" y="625" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">App Service · Azure OpenAI · AI Search</text>
  <text x="1215" y="647" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">Storage / Data Lake · Entra ID</text>
  <text x="1215" y="669" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#475569">Monitor / Log Analytics</text>

  <path d="M1260 495 L1260 560" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M570 630 L670 630" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M970 630 L1060 630" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M1310 270 L1310 345" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M820 270 L820 345" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="80" y="845" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="15" font-weight="700" fill="#334155">핵심 포인트:</text>
  <text x="218" y="845" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="15" fill="#475569">경영관리 Agent는 “자동 판단”이 아니라 “근거 기반 경영 브리프 생성 + 인간 최종 검토”를 기본 원칙으로 설계</text>
</svg>
